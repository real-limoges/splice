name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  criteria:
    strategy:
      fail-fast: false
      matrix:
        include:
          # apt on 24.04 ships an older SBCL (2.2.x), the version the prototype
          # was built on. The runner is pinned because ubuntu-latest moving to a
          # newer release would quietly change which SBCL this job tests.
          # SBCL 2.2.9 weak hash tables corrupt ("Corrupt NEXT-chain") under GC
          # pressure and concurrency, even when mutex-guarded. The migration
          # journal avoids them (strong keys, explicit purging), so a failure
          # here alone may mean weak tables crept back in.
          - name: sbcl-2.2-ubuntu-24.04
            container: ""
            install: sudo apt-get update && sudo apt-get install -y sbcl
          # Arch tracks current SBCL, matching local development. The version
          # floats with Arch; the SBCL version step records which one ran.
          # The container runs as root, so no sudo.
          - name: sbcl-current-arch
            container: archlinux:latest
            install: pacman -Syu --noconfirm sbcl
    name: criteria (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: ${{ matrix.install }}

      - name: SBCL version
        run: sbcl --version

      # FiveAM and its dependencies, for the unit tests. These are the
      # Quicklisp release tarballs local development loads, checked against
      # their SHA-256 so a changed archive fails here rather than in a test.
      # ASDF finds anything under ~/common-lisp/ with no configuration.
      - name: Fetch FiveAM
        run: |
          mkdir -p ~/common-lisp
          cd ~/common-lisp
          base=https://beta.quicklisp.org/archive
          curl -fsSLO $base/alexandria/2024-10-12/alexandria-20241012-git.tgz
          curl -fsSLO $base/asdf-flv/2023-10-21/asdf-flv-version-2.2.tgz
          curl -fsSLO $base/fiveam/2024-10-12/fiveam-20241012-git.tgz
          curl -fsSLO $base/trivial-backtrace/2023-02-14/trivial-backtrace-20230214-git.tgz
          sha256sum -c <<'EOF'
          dcdfc5bac229a952358dfe661f0860e8a02480e406d0d95dee4300cdc3d45b31  alexandria-20241012-git.tgz
          63f3aeaf7a93e9c590e674430dbd80dca387c8a18280bef74d58fcb83551a203  asdf-flv-version-2.2.tgz
          860dd99e52fe83bd4a286f9b85b53981969bf641c1da96b64a895bea4137ab61  fiveam-20241012-git.tgz
          e34a3355ca15c2e0ed84160046c2b16680a7e8b164d67d5a049656786af6c84f  trivial-backtrace-20230214-git.tgz
          EOF
          for archive in *.tgz; do tar -xzf "$archive"; done

      - name: Unit tests
        run: >
          sbcl --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-asd (truename "splice.asd"))'
          --eval '(asdf:test-system "splice")'

      # The cluster systems have no tests yet; loading them checks that they
      # compile, and that the protocol loads without the orders example.
      - name: Cluster loads
        run: >
          sbcl --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-asd (truename "splice.asd"))'
          --eval '(asdf:load-system "splice/cluster-tcp")'

      # The demo rewrites examples/orders/artifacts/demo-audit.log, which is
      # tracked. That is harmless in a throwaway checkout, but a step added later
      # that checks for a clean tree has to run before this one or restore the file.
      - name: Demo
        run: sbcl --non-interactive --load examples/orders/scripts/demo.lisp

      # SPLICE_RUNS=20 is the quick run (about 15 seconds locally); drop it for
      # the full 100 per fault class (about 2 to 4 minutes).
      #
      # C7 is a timing check: the canary shim must cost under 2x a plain call
      # (1.37x locally). Shared runners are noisy, so it is the likeliest flake.
      # If it fails intermittently, loosen the threshold for CI rather than
      # changing the code.
      - name: Criteria
        env:
          SPLICE_RUNS: "20"
        run: >
          sbcl --non-interactive
          --eval '(require :asdf)'
          --eval '(asdf:load-asd (truename "splice.asd"))'
          --eval '(asdf:load-asd (truename "examples/orders/splice-orders.asd"))'
          --eval '(asdf:test-system "splice-orders/criteria")'

      - name: Upload criteria report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criteria-report-${{ matrix.name }}
          path: examples/orders/artifacts/criteria-report.md
          if-no-files-found: ignore
